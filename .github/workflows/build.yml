name: Build desktop apps

# PyInstaller cannot cross-compile, so each OS is built on its own runner.
# Push a tag like v1.0 to produce a release with the .exe and .dmg attached;
# use "Run workflow" on the Actions tab to test a build without releasing.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  APP_NAME: SSA PDF Studio
  PYTHON_VERSION: "3.12"

permissions:
  contents: write # softprops/action-gh-release attaches the .exe and .dmg

jobs:
  windows:
    name: Build Windows (.exe)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build .exe
        run: pyinstaller pdf.spec --clean --noconfirm

      - name: Upload .exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: SSA-PDF-Studio-windows
          path: dist/${{ env.APP_NAME }}.exe
          if-no-files-found: error

      - name: Attach .exe to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ env.APP_NAME }}.exe

  macos:
    name: Build macOS (.dmg, ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    # macos-15-intel is the last Intel image GitHub offers (retiring Fall 2027),
    # so an Intel failure must never block the Apple Silicon release.
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-latest
            experimental: false
          - arch: x86_64
            runner: macos-15-intel
            experimental: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build .app
        run: pyinstaller pdf.spec --clean --noconfirm

      - name: Ad-hoc codesign
        # Apple Silicon refuses to launch a completely unsigned bundle, so sign
        # ad-hoc. This is not notarization: users still need the Gatekeeper
        # bypass documented in the README.
        run: |
          codesign --force --deep --sign - "dist/${APP_NAME}.app"
          codesign --verify --verbose "dist/${APP_NAME}.app"

      - name: Verify bundle structure
        run: |
          app="dist/${APP_NAME}.app"
          test -x "$app/Contents/MacOS/${APP_NAME}" || {
            echo "Bundle executable missing."; exit 1; }
          plutil -lint "$app/Contents/Info.plist"
          # Tk is loaded lazily, so confirm PyInstaller actually collected it.
          test -d "$app/Contents/Frameworks" || {
            echo "Frameworks directory missing."; exit 1; }
          du -sh "$app"

      - name: Smoke test launch
        # Best-effort: a headless runner has no reliable window server, so a
        # failure here is a warning to investigate, not a reason to block a
        # release that is otherwise good.
        continue-on-error: true
        timeout-minutes: 3
        run: |
          "dist/${APP_NAME}.app/Contents/MacOS/${APP_NAME}" >launch.log 2>&1 &
          pid=$!
          sleep 25
          if kill -0 "$pid" 2>/dev/null; then
            echo "App stayed running - imports resolved."
            kill "$pid" 2>/dev/null || true
          else
            echo "App exited early. Output:"
            cat launch.log
            exit 1
          fi

      - name: Package .dmg
        run: |
          brew install create-dmg
          mkdir -p dist/dmg-src
          cp -R "dist/${APP_NAME}.app" dist/dmg-src/
          dmg="dist/SSA-PDF-Studio-macos-${{ matrix.arch }}.dmg"
          # create-dmg intermittently fails while detaching the scratch volume.
          for attempt in 1 2 3 4 5; do
            if create-dmg \
              --volname "${APP_NAME}" \
              --window-pos 200 120 \
              --window-size 640 400 \
              --icon-size 128 \
              --icon "${APP_NAME}.app" 160 190 \
              --hide-extension "${APP_NAME}.app" \
              --app-drop-link 480 190 \
              --skip-jenkins \
              "$dmg" "dist/dmg-src/"; then
              echo "Created $dmg"
              exit 0
            fi
            echo "create-dmg attempt $attempt failed; retrying..."
            sleep 15
          done
          echo "create-dmg failed after 5 attempts."
          exit 1

      - name: Upload .dmg artifact
        uses: actions/upload-artifact@v4
        with:
          name: SSA-PDF-Studio-macos-${{ matrix.arch }}
          path: dist/SSA-PDF-Studio-macos-${{ matrix.arch }}.dmg
          if-no-files-found: error

      - name: Attach .dmg to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/SSA-PDF-Studio-macos-${{ matrix.arch }}.dmg
